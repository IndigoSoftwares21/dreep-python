[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dreep"
dynamic = ["version"]
description = "The official Python SDK for Dreep: media storage, image and video transformation, document conversion, OCR and background removal."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Dreep" }]
keywords = ["dreep", "media", "cdn", "image", "video", "transformation", "upload", "ocr", "pdf"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Framework :: AsyncIO",
  "Framework :: Trio",
  "Topic :: Multimedia",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://dreep.cloud"
Documentation = "https://docs.dreep.cloud"
Repository = "https://github.com/IndigoSoftwares21/dreep-python"
Issues = "https://github.com/IndigoSoftwares21/dreep-python/issues"
Changelog = "https://github.com/IndigoSoftwares21/dreep-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8", "mypy>=1.13", "trio>=0.27"]

[tool.hatch.version]
path = "src/dreep/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dreep"]

[tool.hatch.build.targets.sdist]
include = ["src/dreep", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

# --------------------------------------------------------------------------- #
# Lint and format
# --------------------------------------------------------------------------- #

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts", "examples"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "S", "N", "PL", "PT", "RET",
  "ARG", "PIE", "T20", "TID", "PTH", "PERF", "FBT003",
]
ignore = [
  "PLR0913",  # API methods mirror the endpoint's parameters, keyword-only
  "PLR2004",  # magic values are enforced by scripts/rules (no-magic-strings)
  "S101",     # asserts narrow types; tests use them
  "PERF203",  # retry loops catch inside the loop by design
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S603", "ARG", "PLR0915", "SIM117", "FBT003"]
"scripts/**" = ["T20", "S603", "S607"]
# Generated from async sources, where `yield from` doesn't exist.
"src/dreep/_sync_*.py" = ["UP028"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

# --------------------------------------------------------------------------- #
# Types
# --------------------------------------------------------------------------- #

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src", "tests", "scripts", "examples"]

# --------------------------------------------------------------------------- #
# Tests
# --------------------------------------------------------------------------- #

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["dreep"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = ["if TYPE_CHECKING:", "raise AssertionError", "@overload"]
