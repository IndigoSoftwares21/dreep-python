name: PR checks

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  issue-link:
    name: Linked to an issue
    runs-on: ubuntu-latest
    steps:
      - name: PR description references an issue
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$BODY" | grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?) +#[0-9]+'; then
            echo "Linked issue found."
          else
            echo "::error::Link this PR to an issue: add 'Closes #<number>' to the description. See CONTRIBUTING.md."
            exit 1
          fi
